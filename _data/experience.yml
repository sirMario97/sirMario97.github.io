    es: Lideré a los equipos de ingeniería de datos que construyen sobre Azure Databricks para Grupo Bimbo.
  highlights:
  - en: "Directed development of a lakehouse with landing, curated and semantic zones, deployed across 5 world regions."
    es: "Dirigí el desarrollo de un lakehouse con zonas landing, curated y semantic, desplegado en 5 regiones del mundo."
  - en: "Designed and built dimensional models in the gold and semantic layers, which are used globally for business intelligence."
    es: "Diseñé y construí modelos dimensionales en las capas oro y semántica, que se usan a nivel global para inteligencia de negocio."
  - en: "Took more than 4 global releases of Databricks projects to production. They use native Databricks technology, such as Liquid Clustering and declarative pipelines, that sped up how data is ingested and consumed worldwide."
    es: "Llevé a producción más de 4 liberaciones globales de proyectos en Databricks. Usan tecnologías nativas de la plataforma, como Liquid Clustering y pipelines declarativos, que agilizaron la ingesta y el consumo de información a nivel global."
  - en: "Optimized the data extractors, the ETL jobs in Databricks and the pipelines that build the gold layer. That lowered operating cost, data freshness time and report read time."
    es: "Optimicé los extractores de información, los ETL en Databricks y los pipelines que construyen la capa oro. Con eso bajaron el costo de operación, el tiempo de frescura de los datos y el tiempo de lectura de los reportes."
