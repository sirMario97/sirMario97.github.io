principles:
  - area: {en: Backend, es: Backend}
    title: {en: Tests ship with the code, es: Las pruebas salen con el código}
    text:
      en: On Factoría POA we worked test-first and passed 90% coverage. At ArkonData every Scala or Python service went out with unit and integration tests and was deployed through continuous integration.
      es: En Factoría POA trabajamos con TDD y pasamos de 90 % de cobertura. En ArkonData cada servicio en Scala o Python salía con pruebas unitarias y de integración, y se desplegaba por integración continua.
  - area: {en: Data engineering, es: Ingeniería de datos}
    title: {en: Reconcile before release, es: Conciliar antes de liberar}
    text:
      en: A data model is accepted when its row counts and totals match the source over a closed window. Column names are checked in the catalog before anyone uses them.
      es: Un modelo de datos se acepta cuando sus conteos y totales coinciden con la fuente sobre una ventana cerrada. Los nombres de columnas se revisan en el catálogo antes de usarlos.
  - area: {en: Technical lead, es: Liderazgo técnico}
    title: {en: Realistic workload, es: Carga de trabajo realista}
    text:
      en: Each person carries two deliverables at most and every activity has a backup. Once a week the team shows what it built, and the documentation is versioned with the code.
      es: Cada persona lleva dos entregables como máximo y cada actividad tiene un respaldo. Una vez por semana el equipo muestra lo que construyó, y la documentación se versiona con el código.
  - area: {en: Delivery, es: Delivery}
    title: {en: Every change has a way back, es: Todo cambio tiene regreso}
    text:
      en: Production changes go through the client's review boards with a rollback plan already written. Every week I report releases and incidents to operations and service leadership.
      es: Los cambios a producción pasan por los comités del cliente con el plan de rollback ya escrito. Cada semana reporto liberaciones e incidentes a la dirección de operaciones y servicio.
quote:
  text: The unexamined life is not worth living.
  author: Socrates
