{%- assign groups = site.data.stack -%}
{%- assign n = groups | size -%}
<section id="stack">
  <div class="wrap">
    <header class="sec-head">
      <h2>Stack</h2>
      <p class="label count">({% if n < 10 %}0{% endif %}{{ n }})</p>
    </header>
    <div class="stack">
      {%- for g in groups %}
      <div class="row">
        <p class="g"><span lang="en">{{ g.name.en }}</span><span lang="es">{{ g.name.es }}</span>{% if g.period != "" %}<small class="label">{{ g.period }}</small>{% endif %}</p>
        <ul class="chips">{% for t in g.tools %}<li>{{ t }}</li>{% endfor %}</ul>
      </div>
      {%- endfor %}
    </div>
  </div>
</section>
