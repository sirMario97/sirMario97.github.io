{%- assign p = site.data.profile -%}
<section id="contact" class="contact">
  <div class="wrap">
    <header class="sec-head">
      <h2><span lang="en">Contact</span><span lang="es">Contacto</span></h2>
    </header>
    <a class="mail" href="mailto:{{ p.email }}">{{ p.email }}</a>
    <ul class="links">
      {%- for l in p.links %}
      <li><a class="btn" href="{{ l.url }}" rel="me noopener">{{ l.name }}</a></li>
      {%- endfor %}
    </ul>
  </div>
</section>
